name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check . --select E,F,W,B --line-length 130
      - run: node --check static/app.js
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sfd-bmd .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name app sfd-bmd
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/api/solve -H 'Content-Type: application/json' -d '{"length":6,"point_loads":[{"P":10,"x":2}]}'
